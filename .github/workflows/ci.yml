name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Node tests and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run rule and simulation tests
        run: npm test
      - name: Check shipped JavaScript syntax
        if: ${{ !cancelled() }}
        run: npm run check:syntax

  browser:
    name: Chromium browser smoke
    # Pin the OS supported by the locked Playwright/browser build.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run browser smoke tests against local static server
        run: npm run test:browser
      - name: Upload browser failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
