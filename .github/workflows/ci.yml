name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Node tests and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run rule and simulation tests
        run: npm test
      - name: Check shipped JavaScript syntax
        if: ${{ !cancelled() }}
        run: npm run check:syntax
